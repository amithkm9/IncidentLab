name: Verify IncidentLab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and run real-HTTP integration tests
        run: docker compose --profile test run --build --rm test
      - name: Check Python code quality
        run: |
          docker compose --profile test run --rm test ruff check src tests
          docker compose --profile test run --rm test ruff format --check src tests
      - name: Run baseline smoke evaluation
        run: LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)" docker compose --profile eval run --build --rm eval
      - name: Compare single fixes with isolated rehearsal
        run: LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)" docker compose --profile eval run --rm eval incidentlab-rehearsal-eval --split smoke
      - name: Compare adaptive and ordered policies at equal candidate ceilings
        run: LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)" docker compose --profile eval run --rm eval incidentlab-adaptive-eval --seeds 42 --max-experiments 4 --output artifacts/adaptive-smoke.json
      - name: Detect false recovery from HTTP-only verification
        run: LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)" docker compose --profile eval run --rm eval incidentlab-semantic-eval --split smoke --output artifacts/semantic-smoke.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: incidentlab-evaluations
          path: artifacts/*-smoke.json
