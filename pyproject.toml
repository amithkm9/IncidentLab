[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "incidentlab"
version = "0.2.0"
description = "Evidence-grounded incident investigation with a reproducible failure lab."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
incidentlab = "incidentlab.cli:main"
incidentlab-eval = "incidentlab.evaluate:main"
incidentlab-rehearsal-eval = "incidentlab.evaluate_rehearsal:main"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

