<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">From fault to verified recovery in four steps</title>
  <desc id="desc">Inject a known fault, investigate evidence, rehearse fixes in isolated copies, then approve and verify a recovery plan. In a compound route and pricing failure, no action returns 502, restoring the route alone reveals a 500 pricing error, and rolling back pricing alone leaves a 502 route error. Applying both fixes returns 200 in rehearsal and is then verified with five fresh requests after approval.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#95b3a2"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #172b25; }
      .title { font-size: 32px; font-weight: 700; letter-spacing: -1px; }
      .heading { font-size: 21px; font-weight: 650; }
      .body { font-size: 18px; }
      .note { font-size: 16px; fill: #52685e; }
      .step { font-size: 16px; font-weight: 700; fill: #2e6651; letter-spacing: 1px; }
      .line { stroke: #95b3a2; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="680" rx="24" fill="#f7faf7"/>
  <text class="title" x="32" y="53">A fix can reveal another failure.</text>
  <text class="body" x="32" y="84">Follow the evidence, compare outcomes, and change the lab only after review.</text>

  <rect x="32" y="116" width="216" height="132" rx="14" fill="#e8f4ed" stroke="#c9dfd1"/>
  <text class="step" x="52" y="147">01 / INJECT</text>
  <text class="heading" x="52" y="181">Create an incident</text>
  <text class="note" x="52" y="216">Choose a known fault</text>
  <path class="line" d="M250 182H269"/>
  <rect x="272" y="116" width="216" height="132" rx="14" fill="#fff" stroke="#d7e3db"/>
  <text class="step" x="292" y="147">02 / INVESTIGATE</text>
  <text class="heading" x="292" y="181">Explain the failure</text>
  <text class="note" x="292" y="216">Read logs + evidence</text>
  <path class="line" d="M490 182H509"/>
  <rect x="512" y="116" width="216" height="132" rx="14" fill="#fff" stroke="#d7e3db"/>
  <text class="step" x="532" y="147">03 / REHEARSE</text>
  <text class="heading" x="532" y="181">Compare real fixes</text>
  <text class="note" x="532" y="216">Test isolated copies</text>
  <path class="line" d="M730 182H749"/>
  <rect x="752" y="116" width="216" height="132" rx="14" fill="#103e32"/>
  <text x="772" y="147" font-size="16" font-weight="700" letter-spacing="1" style="fill:#b9dfc9">04 / VERIFY</text>
  <text x="772" y="181" font-size="21" font-weight="650" style="fill:#fff">Promote a plan</text>
  <text x="772" y="216" font-size="16" style="fill:#d1e9dc">Approve + send traffic</text>

  <text class="heading" x="32" y="301">Example: route drift masks a pricing regression</text>
  <text class="note" x="32" y="329">Every candidate starts from the same broken snapshot. Only the combined plan restores checkout.</text>
  <rect x="32" y="354" width="936" height="250" rx="14" fill="#fff" stroke="#d7e3db"/>
  <path d="M32 406H968M32 466H968M32 526H968" stroke="#e4ece6"/>
  <text class="note" x="56" y="387">PLAN TESTED IN ISOLATION</text>
  <text class="note" x="560" y="387">OBSERVED OUTCOME</text>
  <text class="body" x="56" y="443">No-action control</text>
  <text class="body" x="560" y="443">502 · inventory route still broken</text>
  <text class="body" x="56" y="503">Restore inventory route</text>
  <text class="body" x="560" y="503">500 · pricing failure becomes visible</text>
  <text class="body" x="56" y="563">Roll back pricing release</text>
  <text class="body" x="560" y="563">502 · inventory route still broken</text>
  <rect x="32" y="616" width="936" height="48" rx="12" fill="#e0f0e6"/>
  <text x="56" y="646" font-size="18" font-weight="650">Restore route + roll back release</text>
  <text x="560" y="646" font-size="18" font-weight="650" fill="#256b47">200 · smallest successful recovery plan</text>
</svg>
