<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="944" viewBox="0 0 1000 944" role="img" aria-labelledby="title desc">
  <title id="title">IncidentLab architecture: evidence, isolated experiments, and verified recovery</title>
  <desc id="desc">A browser uses a FastAPI orchestrator. A baseline or Mistral investigator reads evidence through allowlisted tools from real checkout and inventory HTTP services and a SQLite catalog. BM25 searches local runbooks. A snapshot of the active lab produces isolated copies for a no-action control and up to fifteen candidate plans. The shortest successful plan requires operator approval and episode, revision, and fingerprint checks before application and five fresh verification requests. SQLite stores history and audit events for JSON and Markdown exports.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#54786a"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #172b25; }
      .title { font-size: 32px; font-weight: 700; letter-spacing: -1px; }
      .heading { font-size: 21px; font-weight: 650; }
      .body { font-size: 18px; }
      .note { font-size: 16px; fill: #52685e; }
      .label { font-size: 16px; font-weight: 650; fill: #2e6651; letter-spacing: 1px; }
      .line { fill: none; stroke: #54786a; stroke-width: 2; marker-end: url(#arrow); }
      .card { fill: #fff; stroke: #d7e3db; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1000" height="944" rx="24" fill="#f7faf7"/>
  <text class="title" x="32" y="53">Evidence first. Experiments before action.</text>
  <text class="body" x="32" y="84" fill="#52685e">One local workbench, with a clear boundary between observing and changing.</text>

  <rect class="card" x="32" y="122" width="224" height="102" rx="14"/>
  <text class="heading" x="54" y="160">Browser workspace</text>
  <text class="note" x="54" y="190">Inspect and approve</text>
  <path class="line" d="M258 173H304"/>
  <rect x="310" y="122" width="318" height="102" rx="14" fill="#103e32"/>
  <text x="334" y="160" font-size="21" font-weight="650" style="fill:#fff">FastAPI orchestrator</text>
  <text x="334" y="190" font-size="16" style="fill:#d1e9dc">One active lab · serialized mutations</text>
  <path class="line" d="M630 173H676"/>
  <rect class="card" x="682" y="122" width="286" height="102" rx="14"/>
  <text class="heading" x="704" y="160">Durable SQLite history</text>
  <text class="note" x="704" y="190">Audit events · JSON / Markdown</text>

  <path class="line" d="M418 226V286"/>
  <path class="line" d="M520 226V252H749V286"/>
  <text class="label" x="32" y="274">READ-ONLY INVESTIGATION</text>
  <rect class="card" x="32" y="292" width="438" height="198" rx="16"/>
  <text class="heading" x="56" y="330">Baseline or Mistral investigator</text>
  <text class="body" x="56" y="365">Typed findings + observed evidence IDs</text>
  <rect x="56" y="385" width="390" height="41" rx="8" fill="#e8f4ed"/>
  <text class="note" x="72" y="412">Allowlisted tools: logs, health, metrics, changes</text>
  <text class="note" x="56" y="461">BM25 runbooks provide diagnostic guidance.</text>
  <path class="line" d="M472 390H526"/>
  <text class="label" x="530" y="274">ACTIVE DISPOSABLE LAB</text>
  <rect class="card" x="530" y="292" width="438" height="198" rx="16"/>
  <rect x="554" y="316" width="170" height="64" rx="10" fill="#e8f4ed"/>
  <text class="heading" x="576" y="355">Checkout</text>
  <path class="line" d="M726 348H764"/>
  <rect x="770" y="316" width="174" height="64" rx="10" fill="#e8f4ed"/>
  <text class="heading" x="792" y="355">Inventory</text>
  <path class="line" d="M639 382V413"/>
  <rect x="554" y="419" width="170" height="47" rx="10" fill="#f2f5f2"/>
  <text class="body" x="576" y="449">SQLite catalog</text>
  <text class="note" x="752" y="431">Real HTTP traffic</text>
  <text class="note" x="752" y="455">Independent local ports</text>

  <path class="line" d="M749 492V516H180V537"/>
  <rect x="32" y="542" width="936" height="346" rx="18" fill="#e8f4ed" stroke="#c9dfd1" stroke-width="1.5"/>
  <text class="label" x="58" y="577">ISOLATED FIX REHEARSAL</text>
  <path class="line" d="M180 590V609"/>
  <rect class="card" x="60" y="615" width="240" height="115" rx="12"/>
  <text class="heading" x="80" y="651">State snapshot</text>
  <text class="note" x="80" y="681">Config + database + faults</text>
  <text class="note" x="80" y="706">Source lab stays unchanged</text>
  <path class="line" d="M302 672H354"/>
  <rect class="card" x="360" y="615" width="280" height="115" rx="12"/>
  <text class="heading" x="380" y="651">Control + up to 15 plans</text>
  <text class="note" x="380" y="681">5 single fixes + 10 pairs</text>
  <text class="note" x="380" y="706">Fresh HTTP / SQLite copies</text>
  <path class="line" d="M642 672H694"/>
  <rect class="card" x="700" y="615" width="240" height="115" rx="12"/>
  <text class="heading" x="720" y="651">Minimal passing plan</text>
  <text class="note" x="720" y="681">Measured request outcomes</text>
  <text class="note" x="720" y="706">Or no change / abstention</text>
  <path class="line" d="M820 732V766"/>
  <rect x="560" y="772" width="380" height="88" rx="12" fill="#103e32"/>
  <text x="582" y="807" font-size="20" font-weight="650" style="fill:#fff">Operator approval + state checks</text>
  <text x="582" y="835" font-size="16" style="fill:#d1e9dc">Episode · revision · snapshot fingerprint</text>
  <path class="line" d="M558 816H498"/>
  <rect class="card" x="60" y="772" width="430" height="88" rx="12"/>
  <text class="heading" x="82" y="807">Apply to active lab, then verify</text>
  <text class="note" x="82" y="835">Require 5 fresh HTTP 200 checkout responses</text>
  <text class="note" x="32" y="922">Scope: a purpose-built local HTTP / SQLite lab. Production infrastructure is not cloned or changed.</text>
</svg>
